name: 'AppMicroserviceAction'
description: 'Deploy resources for microservice'
inputs:
  app-name:
    description: 'Application id'
    required: true
  app-suffix:
    description: 'Suffix for namming'
    default: ''
  aws-role:
    description: 'Aws role to apply changes'
    required: true
  terraform-version:
    description: 'Terraform version to install'
    default: '1.9.7'
  terragrunt-version:
    description: 'Terragrunt version to install'
    default: '0.68.1'
  application-git-url:
    description: 'Git url to use for pulling repo terraform-app-microservice'
    default: 'git@gitlab.com:orisha-group/construction/advae/common/infrastructure/terraform-app-microservice.git'
  application-ref:
    description: 'Ref to use for pulling repo terraform-app-microservice'
    default: 'master'
  deployment-descriptors-repo:
    description: 'Repository to push deployment descriptors'
    default: 'FinalCAD/infrastructure-deployment-descriptors'
  deployment-descriptors-ref:
    description: 'Git ref to use for pushing deployment descriptors'
    default: 'master'
  github-token:
    description: 'Github token to pull package to avoid limit rate'
    default: ''
  github-ssh:
    description: 'Github ssh key to pull terragrunt from github api'
    required: true
  environment:
    description: 'Finalcad environment: production, staging, sandbox'
    required: true
  region-friendly:
    description: 'Finalcad region: frankfurt or tokyo'
    default: 'frankfurt'
  application-file:
    description: 'File with path for application configuration'
    default: '.finalcad/application.yaml'
  dry-run:
    description: 'Dry run'
    default: 'false'
  pr-number:
    description: 'Pull request number, empty for push'
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Setup SSH agent
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ inputs.github-ssh }}
    - name: Setup SSH known hosts
      shell: bash
      run: |
        echo '::group::Setup SSH known hosts'
        [[ -d ~/.ssh ]] || mkdir -p ~/.ssh
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
        echo '::endgroup::'
    - name: Checkout application repository
      uses: actions/checkout@v7
      with:
        path: 'app'
    - name: Checkout terragrunt repository
      shell: bash
      run: |
        echo '::group::Checkout terragrunt repository'
        git clone \
          --progress \
          --branch '${{ inputs.application-ref }}' \
          --depth 1 \
          --no-tags \
          '${{ inputs.application-git-url }}' \
          'terragrunt'
        echo '::endgroup::'
    - name: Checkout deployment descriptor repository
      uses: actions/checkout@v7
      with:
        ssh-key: ${{ inputs.github-ssh }}
        repository: "${{ inputs.deployment-descriptors-repo }}"
        ref: ${{ inputs.deployment-descriptors-ref }}
        path: 'deployment-descriptors'
    - name: Detect aws region
      id: aws_region
      shell: bash
      run: |
        set -e
        case '${{ inputs.region-friendly }}' in
            'frankfurt') awsregion='eu-central-1';;
            'tokyo') awsregion='ap-northeast-1';;
        esac
        echo "awsregion=${awsregion}" >> $GITHUB_OUTPUT
    # Setup terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false
    # Setup terragrunt
    - name: Terragrunt Binary Installer Action
      uses: autero1/action-terragrunt@v3
      if: inputs.terragrunt-version != 'disabled'
      with:
        terragrunt-version: ${{ inputs.terragrunt-version }}
        token: ${{ inputs.github-token }}
    # Copy application configuration file
    - name: Application file
      id: applicationfile
      shell: bash
      run: |
        set -e
        if ! [ -f ./app/${{ inputs.application-file }} ]; then
          echo "application file is missing"
          exit 1
        fi
        cp ./app/${{ inputs.application-file }} ./terragrunt/application.yaml
    # Setup go
    - name: Setup go
      uses: actions/setup-go@v7
      with:
        token: ${{ inputs.github-token }}
        go-version: 1.18
    # Setup yq & cue
    - name: Setup cue
      shell: bash
      run: |
        go install cuelang.org/go/cmd/cue@v0.4.3
    # Cue vetting
    - name: Cue vetting
      shell: bash
      run: |
        set -e
        cue vet ./terragrunt/application.yaml ./terragrunt/application.cue
    # Publish descriptor
    - name: Publish descriptor
      if: inputs.pr-number == ''
      shell: bash
      run: "${GITHUB_ACTION_PATH}/bin/publish-descriptor.sh"
      env:
        DEPLOYMENT_DESCRIPTOR_FILE: ./app/${{ inputs.application-file }}
        DEPLOYMENT_DESCRIPTOR_GIT_REPOSITORY: ./deployment-descriptors
        FINALCAD_ENVIRONMENT: ${{ inputs.environment }}
        FINALCAD_REGION_FRIENDLY: ${{ inputs.region-friendly }}
        MICROSERVICE_GIT_REPOSITORY: ./app
        TERRAFORM_GIT_REPOSITORY: ./terragrunt
        TF_VAR_application_id: ${{ inputs.app-name }}
        TF_VAR_application_suffix: ${{ inputs.app-suffix }}
        DRY_RUN: ${{ inputs.dry-run }}
    # Configure aws credentials
    - name: Configure AWS credentials for security
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ steps.aws_region.outputs.awsregion }}
        role-to-assume: ${{ inputs.aws-role }}
        role-session-name: OIDCSession
    # Terragrunt plan
    - name: Terragrunt plan
      if: inputs.pr-number != ''
      shell: bash
      run: |
        set -e
        cd ./terragrunt/${{ inputs.environment }}/${{ inputs.region-friendly }}
        export TF_VAR_application_id=${{ inputs.app-name }}
        export TF_VAR_application_suffix=${{ inputs.app-suffix }}
        terragrunt run-all init -reconfigure
        terragrunt run-all plan -out plan
        terragrunt run-all show plan -no-color > ${{ github.workspace }}/terragrunt/plan.txt
      continue-on-error: true
    # Comment on pr
    - uses: actions/github-script@v9
      if: inputs.pr-number != '' && !cancelled()
      env:
        PLAN: ${{ steps.plan.outputs.show }}
      with:
        script: |
          const fs = require('fs')
          const data = fs.readFileSync('${{ github.workspace }}/terragrunt/plan.txt')
          const output = `#### Terraform Plan : \`${{ steps.plan.outcome }}\`
          <details><summary>Show Plan</summary>\n
          \`\`\`terraform\n
          ${data}
          \`\`\`\n
          </details>
          *Pushed by: @${{ github.actor }}`;
          github.rest.issues.createComment({
            issue_number: ${{ inputs.pr-number }},
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })
    #Apply terragrunt
    - name: Terragrunt apply
      if: inputs.pr-number == '' && inputs.dry-run == 'false'
      shell: bash
      run: |
        set -e
        cd ./terragrunt/${{ inputs.environment }}/${{ inputs.region-friendly }}
        export TF_VAR_application_id=${{ inputs.app-name }}
        export TF_VAR_application_suffix=${{ inputs.app-suffix }}
        terragrunt run-all init -reconfigure
        terragrunt run-all apply -auto-approve --terragrunt-non-interactive
    - name: Clear local repositories
      shell: bash
      run: |
        echo '::group::Clear local repositories'
        rm -rf './terragrunt'
        echo '::endgroup::'
